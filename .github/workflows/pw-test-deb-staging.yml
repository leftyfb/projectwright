name: pw-test Debian staging smoke

# The LXD runner consumes an already-built, successful hosted-CI artifact.
# No pip, package installation, sudo or host operations are needed.
on:
  push:
    branches: [test/review-followups]
    paths: [.github/pw-test-deb-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pw-test-deb-staging
  cancel-in-progress: false

jobs:
  stage-deb:
    runs-on: [self-hosted, linux, projectwright-lxd-install]
    timeout-minutes: 15
    steps:
      - name: Assert disposable LXC identity before doing work
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(id -u)" -ne 0
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          test ! -e /usr/bin/pw

      - name: Select latest successful hosted-CI Debian artifact on review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, urllib.request
          url = (
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"]
              + "/actions/workflows/offline-tests.yml/runs"
              + "?branch=test%2Freview-followups&status=success&per_page=20"
          )
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "projectwright-pw-test-artifact-selector",
          })
          with urllib.request.urlopen(req, timeout=20) as res:
              runs = json.load(res)["workflow_runs"]
          for run in runs:
              if (run["event"] == "push" and
                  run["head_branch"] == "test/review-followups" and
                  run["conclusion"] == "success" and
                  run["repository"]["full_name"] == os.environ["GH_REPOSITORY"]):
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                      output.write("DEB_RUN_ID=" + str(run["id"]) + "\n")
                      output.write("DEB_SOURCE_SHA=" + run["head_sha"] + "\n")
                  print("Verified hosted CI run:", run["id"], "source:", run["head_sha"])
                  break
          else:
              raise SystemExit("No successful trusted hosted-CI run found")
          PY

      - name: Download hosted-CI Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: projectwright-deb-${{ env.DEB_RUN_ID }}
          run-id: ${{ env.DEB_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pw-hosted-deb

      - name: Extract and smoke-test the unchanged Debian package
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/pw-deb-stage.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb --field "${debs[0]}" Package)" = projectwright
          echo "Package built from reviewed commit: $DEB_SOURCE_SHA"
          sha256sum "${debs[0]}"
          dpkg-deb --info "${debs[0]}"
          dpkg-deb --extract "${debs[0]}" "$work/root"
          export PYTHONPATH="$work/root/usr/lib/python3/dist-packages"
          for command in pw pw-dispatch pw-manager pw-worker pw-notify pw-timer; do
            "$work/root/usr/bin/$command" --help >/dev/null
          done
          mkdir -p "$work/home"
          HOME="$work/home" "$work/root/usr/bin/pw" defaults --project disposable >/dev/null
          test ! -e "$work/home/.hermes"
          test -f "$work/root/usr/share/projectwright/hermes/projectwright-approvals/plugin.yaml"
          test -f "$work/root/usr/share/projectwright/systemd/user/projectwright-approval-notify.timer"
          test ! -e /usr/bin/pw
          echo "PASS: hosted-CI Debian preview extracted and smoke-tested in LXC; no package installed"
