name: pw-test Debian staging smoke

# The LXD runner consumes an already-built, successful hosted-CI artifact.
# No pip, package installation, sudo or host operations are needed.
on:
  push:
    branches: [test/review-followups]
    paths: [.github/pw-test-deb-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pw-test-deb-staging
  cancel-in-progress: false

jobs:
  stage-deb:
    runs-on: [self-hosted, linux, projectwright-lxd-install]
    timeout-minutes: 15
    steps:
      - name: Assert disposable LXC identity before doing work
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(id -u)" -ne 0
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          test ! -e /usr/bin/pw

      - name: Checkout reviewed lifecycle harness
        uses: actions/checkout@v4
        with:
          ref: test/review-followups
          persist-credentials: false

      - name: Verify unprivileged runner cannot invoke installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/pw-test-deb-lifecycle.sh
          if bash scripts/pw-test-deb-lifecycle.sh /does-not-exist 2>"$RUNNER_TEMP/pw-root-denial.log"; then
            echo "ERROR: installer unexpectedly accepted non-root execution" >&2
            exit 1
          fi
          grep -Fq 'requires explicit root invocation' "$RUNNER_TEMP/pw-root-denial.log"
          echo "PASS: root-only lifecycle harness refuses the Actions runner"

      - name: Select latest successful hosted-CI Debian artifact on review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, urllib.request
          url = (
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"]
              + "/actions/workflows/offline-tests.yml/runs"
              + "?branch=test%2Freview-followups&status=success&per_page=20"
          )
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "projectwright-pw-test-artifact-selector",
          })
          with urllib.request.urlopen(req, timeout=20) as res:
              runs = json.load(res)["workflow_runs"]
          for run in runs:
              if (run["event"] == "push" and
                  run["head_branch"] == "test/review-followups" and
                  run["conclusion"] == "success" and
                  run["repository"]["full_name"] == os.environ["GH_REPOSITORY"]):
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                      output.write("DEB_RUN_ID=" + str(run["id"]) + "\n")
                      output.write("DEB_SOURCE_SHA=" + run["head_sha"] + "\n")
                  print("Verified hosted CI run:", run["id"], "source:", run["head_sha"])
                  break
          else:
              raise SystemExit("No successful trusted hosted-CI run found")
          PY

      - name: Download hosted-CI Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: projectwright-deb-${{ env.DEB_RUN_ID }}
          run-id: ${{ env.DEB_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pw-hosted-deb

      - name: Extract and smoke-test the unchanged Debian package
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/pw-deb-stage.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb --field "${debs[0]}" Package)" = projectwright
          echo "Package built from reviewed commit: $DEB_SOURCE_SHA"
          sha256sum "${debs[0]}"
          dpkg-deb --info "${debs[0]}"
          dpkg-deb --extract "${debs[0]}" "$work/root"
          export PYTHONPATH="$work/root/usr/lib/python3/dist-packages"
          for command in pw pw-dispatch pw-manager pw-worker pw-notify pw-timer; do
            "$work/root/usr/bin/$command" --help >/dev/null
          done
          mkdir -p "$work/home"
          HOME="$work/home" "$work/root/usr/bin/pw" defaults --project disposable >/dev/null
          test ! -e "$work/home/.hermes"
          test -f "$work/root/usr/share/projectwright/hermes/projectwright-approvals/plugin.yaml"
          test -f "$work/root/usr/share/projectwright/systemd/user/projectwright-approval-notify.timer"
          test ! -e /usr/bin/pw
          echo "PASS: hosted-CI Debian preview extracted and smoke-tested in LXC; no package installed"

      - name: Install synthetic older version, upgrade and purge in LXC
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          sudo -n true
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          fixture="$(mktemp -d "${RUNNER_TEMP}/pw-upgrade.XXXXXXXX")"
          trap 'rm -rf "$fixture"' EXIT
          dpkg-deb --raw-extract "${debs[0]}" "$fixture/tree"
          sed -i 's/^Version: 0.1.0~dev0-1/Version: 0.1.0~dev0-0/' "$fixture/tree/DEBIAN/control"
          grep -Fxq 'Version: 0.1.0~dev0-0' "$fixture/tree/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$fixture/tree" "$fixture/older.deb"
          sudo -n bash scripts/pw-test-deb-lifecycle.sh "${debs[0]}" "$fixture/older.deb"
          test ! -e /usr/bin/pw
          test ! -e /usr/share/projectwright
          echo 'PASS: synthetic Debian version upgrade, reinstall and purge inside pw-test'

      - name: Verify real per-user systemd timer onboarding with mock Telegram credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          bash -n scripts/pw-test-user-onboarding.sh
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          cleanup() {
            status=$?
            trap - EXIT
            sudo -n dpkg --purge projectwright || status=1
            exit "$status"
          }
          trap cleanup EXIT
          sudo -n dpkg --install "${debs[0]}"
          if test -e "$HOME/.hermes/.env" || test -L "$HOME/.hermes/.env"; then
            echo 'SKIP: existing Hermes credentials present; never replace them with timer test fixture'
          else
            bash scripts/pw-test-user-onboarding.sh
            echo 'PASS: real systemd user timer onboarding with disposable credentials'
          fi

      - name: Verify native Projectwright Hermes plugin registration and cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          bash -n scripts/pw-test-hermes-plugin.sh
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          cleanup() {
            status=$?
            trap - EXIT
            sudo -n dpkg --purge projectwright || status=1
            exit "$status"
          }
          trap cleanup EXIT
          sudo -n dpkg --install "${debs[0]}"
          bash scripts/pw-test-hermes-plugin.sh
          echo 'PASS: Hermes plugin registration and cleanup against isolated pw-test'

      - name: Load plugin into running test Hermes gateway and restore prior state
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/pw-test-hermes-gateway.sh
          shopt -s nullglob
          debs=("${RUNNER_TEMP}"/pw-hosted-deb/*.deb)
          test "${#debs[@]}" -eq 1
          cleanup() {
            status=$?
            trap - EXIT
            sudo -n dpkg --purge projectwright || status=1
            exit "$status"
          }
          trap cleanup EXIT
          sudo -n dpkg --install "${debs[0]}"
          bash scripts/pw-test-hermes-gateway.sh

      - name: Retain tested Debian package
        uses: actions/upload-artifact@v4
        with:
          name: pw-test-verified-deb-${{ github.run_id }}
          path: ${{ runner.temp }}/pw-hosted-deb/*.deb
          retention-days: 7
          if-no-files-found: error
