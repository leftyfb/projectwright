name: Tux isolated verification

on:
  workflow_dispatch:
  push:
    branches:
      - test/review-followups
    paths:
      - .github/tux-run-once.txt

permissions:
  contents: read

concurrency:
  group: tux-isolated-tests
  cancel-in-progress: false

jobs:
  offline-on-tux:
    # Register this label only on an isolated, non-privileged runner.
    runs-on: [self-hosted, linux, x64, projectwright-isolated]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOME: ${{ runner.temp }}/projectwright-home
      HERMES_PROJECT_CONFIG_DIR: ${{ runner.temp }}/projectwright-home/.hermes/projects
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create empty test home
        shell: bash
        run: |
          mkdir -p "$HOME/.hermes/projects" "$RUNNER_TEMP/projectwright-test-logs"

      - name: Offline unittest suite
        shell: bash
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/projectwright-test-logs/unittest.log"

      - name: Development validator
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 -B scripts/validate-baseline.py --mode development \
            2>&1 | tee "$RUNNER_TEMP/projectwright-test-logs/validator.log"

      - name: Upload ephemeral logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tux-offline-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projectwright-test-logs/
          retention-days: 7
          if-no-files-found: warn
