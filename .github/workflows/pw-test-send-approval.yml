name: pw-test Send Live Approval
on:
  push:
    branches: [test/review-followups]
    paths: [.github/pw-test-send-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pw-test-live-approval
  cancel-in-progress: false

jobs:
  send:
    runs-on: [self-hosted, linux, projectwright-lxd-install]
    timeout-minutes: 5
    steps:
      - name: Confirm sandbox and live gateway isolation before delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          test -f /home/ubuntu/projectwright-live-test/projects/pwtelecheck/telegram_approval_pending.json
          test -f "$HOME/.hermes/plugins/projectwright-approvals/plugin.yaml"
          systemctl --user is-active --quiet hermes-gateway.service
          pid="$(systemctl --user show -p MainPID --value hermes-gateway.service)"
          PID="$pid" python3 -B - <<'PY'
          import os
          from pathlib import Path
          assert int(os.environ["PID"]) > 1
          entries=Path("/proc/"+os.environ["PID"]+"/environ").read_bytes().split(bytes([0]))
          assert b"PROJECTWRIGHT_APPROVAL_ROOT=/home/ubuntu/projectwright-live-test/projects" in entries
          PY
          test "$(dpkg-query -W -f='${Status}' projectwright)" = 'install ok installed'
      - name: Deliver one authentic Telegram approval with idempotent notifier
        shell: bash
        run: |
          set -euo pipefail
          pw-notify --root /home/ubuntu/projectwright-live-test/projects --send
          test -f /home/ubuntu/projectwright-live-test/projects/pwtelecheck/telegram_approval_notified.json
          echo 'PASS: live Telegram approval delivered by Projectwright notifier'
