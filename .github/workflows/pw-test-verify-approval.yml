name: pw-test Verify Live Approval
on:
  workflow_dispatch:
  push:
    branches: [test/review-followups]
    paths: [.github/pw-test-verify-trigger.txt]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, projectwright-lxd-install]
    timeout-minutes: 5
    steps:
      - name: Check disposable approval receipt without modifying it
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pw-test
          test "$(id -un)" = ubuntu
          test "$(systemd-detect-virt --container)" = lxc
          test "$RUNNER_NAME" = pw-test-projectwright
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/projectwright-live-test/projects/pwtelecheck')
          receipt=p/'planning_state.json'
          reject=p/'telegram_approval_rejected.json'
          pending=p/'telegram_approval_pending.json'
          if receipt.exists():
              state=json.loads(receipt.read_text())
              assert 'DEMO-1-M1' in state.get('verified_milestones',{})
              assert not pending.exists()
              print('PASS: Telegram callback wrote verified acceptance receipt; request consumed')
          elif reject.exists():
              assert pending.exists()
              print('REJECTED: callback saved rejection and retained request')
          elif pending.exists():
              print('PENDING: user has not completed an approval/rejection callback yet')
          else:
              raise SystemExit('FAIL: no pending or resolved approval record')
          PY
