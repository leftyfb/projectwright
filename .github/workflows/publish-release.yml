name: Publish Projectwright release

# Manual for future patch releases. A one-time, explicitly edited trigger file
# bootstraps 0.1.0 because release tooling cannot dispatch a workflow through
# the connected GitHub API. Never publish on an ordinary code push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag, e.g. 0.1.1 (no v prefix)'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character tested release branch commit SHA'
        required: true
        type: string
      artifact_run_id:
        description: 'Successful Ubuntu LTS matrix Actions run ID for source_sha'
        required: true
        type: string
  push:
    branches: [main]
    paths: [.github/release-0.1.0-publish-trigger.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: projectwright-publish-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'leftyfb/projectwright' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
      SOURCE_SHA: ${{ inputs.source_sha || 'a07c39a844439c8b20ef7aa58ee57d7e0aa3e0e0' }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '40437443529' }}
    steps:
      - name: Reject unexpected release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'REFUSED: version must be a plain numeric tag, no v prefix' >&2; exit 2;
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'REFUSED: source SHA must be exact' >&2; exit 2;
          }
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo 'REFUSED: CI run ID must be numeric' >&2; exit 2;
          }
          if [[ "${{ github.event_name }}" == push ]]; then
            test "$RELEASE_VERSION" = '0.1.0'
            test "$SOURCE_SHA" = 'a07c39a844439c8b20ef7aa58ee57d7e0aa3e0e0'
            test "$ARTIFACT_RUN_ID" = '40437443529'
          fi
          command -v gh
          command -v dpkg-deb

      - name: Check out the exact tested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source branch, metadata and successful LTS matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/release/$RELEASE_VERSION" | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo 'REFUSED: release branch head differs from tested source SHA' >&2; exit 2;
          }
          RELEASE_VERSION="$RELEASE_VERSION" python3 -B - <<'PY'
          import os, pathlib, tomllib
          root=pathlib.Path('.')
          expected=os.environ['RELEASE_VERSION']
          meta=tomllib.loads((root/'pyproject.toml').read_text())
          assert meta['project']['version'] == expected, 'project version differs'
          assert f'Version: {expected}-1' in (root/'scripts/build-deb.sh').read_text(), 'Debian version differs'
          assert (root/'docs/release-notes.md').is_file(), 'release notes absent'
          print('PASS: source metadata matches release version')
          PY
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          RUN_JSON="$details" python3 -B - <<'PY'
          import json,os
          run=json.loads(os.environ['RUN_JSON'])
          expected={
              'conclusion':'success',
              'head_sha':os.environ['SOURCE_SHA'],
              'head_branch':'release/'+os.environ['RELEASE_VERSION'],
              'name':'Ubuntu 24.04 and 26.04 Debian compatibility',
          }
          for field,value in expected.items():
              assert run.get(field)==value, f'release CI mismatch: {field}'
          print('PASS: exact release commit passed hosted Ubuntu LTS matrix')
          PY

      - name: Download and validate the exact tested package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh run download "$ARTIFACT_RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name projectwright-ubuntu-lts-matrix-deb --dir "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -L "projectwright_${RELEASE_VERSION}-1_all.deb"
          test ! -L SHA256SUMS
          test -f "projectwright_${RELEASE_VERSION}-1_all.deb"
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb --field "projectwright_${RELEASE_VERSION}-1_all.deb" Package)" = projectwright
          test "$(dpkg-deb --field "projectwright_${RELEASE_VERSION}-1_all.deb" Version)" = "$RELEASE_VERSION-1"
          test "$(dpkg-deb --field "projectwright_${RELEASE_VERSION}-1_all.deb" Architecture)" = all
          echo "PASS: artifact SHA256 and exact Debian metadata verified"

      - name: Create immutable version marker and publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'REFUSED: release already exists; no overwrite or replacement' >&2
            exit 2
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            test "$(git rev-parse "$RELEASE_VERSION^{commit}")" = "$SOURCE_SHA" || {
              echo 'REFUSED: existing tag points to a different commit' >&2; exit 2;
            }
            echo 'Existing correct tag verified; retrying release creation'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_VERSION" "$SOURCE_SHA" -m "Projectwright $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi
          # Release notes are concise and publication-safe; detailed manual is
          # available at docs/release-notes.md in the tagged source.
          {
            echo "Projectwright $RELEASE_VERSION"
            echo
            echo 'First versioned Debian release of Hermes-based requirements-to-Git task orchestration.'
            echo
            echo '- Supported: Ubuntu 24.04 and 26.04 LTS; Hermes is required and installed separately.'
            echo '- Telegram approval is detected during \`pw setup\` and enabled only after consent.'
            echo '- Installs package-owned files only; no automatic Hermes restart or secret changes.'
            echo '- The Debian package was verified by the hosted LTS matrix on this exact tagged source.'
            echo
            echo 'Install after downloading both attached files:'
            echo
            echo '    sha256sum -c SHA256SUMS'
            echo "    sudo apt install ./projectwright_${RELEASE_VERSION}-1_all.deb"
            echo '    pw setup'
            echo
            echo 'See docs/release-notes.md and docs/packaging-and-operations.md in the tagged source for prerequisites, upgrade, removal and known limitations.'
          } > "$RUNNER_TEMP/release-body.md"
          gh release create "$RELEASE_VERSION" \
            "$RUNNER_TEMP/release-assets/projectwright_${RELEASE_VERSION}-1_all.deb" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" \
            --verify-tag --title "Projectwright $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            -R "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_VERSION" -R "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url \
            --jq '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'
